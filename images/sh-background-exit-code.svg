<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Why a trailing ampersand makes Jenkins report SUCCESS even when the command fails</title>
  <rect width="820" height="300" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <!-- Row 1: without & -->
  <text x="20" y="30" font-size="14" font-weight="600" fill="#1f2328">Without &amp;: sh waits for the command</text>
  <g font-size="13">
    <rect x="20" y="45" width="170" height="60" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <text x="105" y="72" text-anchor="middle" font-weight="600" fill="#1f2328">sh step starts</text>
    <text x="105" y="91" text-anchor="middle" font-size="12" fill="#57606a">./go-webapp-sample</text>

    <rect x="230" y="45" width="190" height="60" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <text x="325" y="72" text-anchor="middle" font-weight="600" fill="#1f2328">waits until it exits</text>
    <text x="325" y="91" text-anchor="middle" font-size="12" fill="#57606a">e.g. "not found", exit 127</text>

    <rect x="460" y="45" width="160" height="60" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <text x="540" y="72" text-anchor="middle" font-weight="600" fill="#1f2328">sh returns 127</text>
    <text x="540" y="91" text-anchor="middle" font-size="12" fill="#57606a">the real exit code</text>

    <rect x="660" y="45" width="140" height="60" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
    <text x="730" y="72" text-anchor="middle" font-weight="700" fill="#cf222e">FAILURE</text>
    <text x="730" y="91" text-anchor="middle" font-size="12" fill="#57606a">correct result</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" marker-end="url(#b)">
    <line x1="190" y1="75" x2="228" y2="75"/>
    <line x1="420" y1="75" x2="458" y2="75"/>
    <line x1="620" y1="75" x2="658" y2="75"/>
  </g>

  <line x1="20" y1="140" x2="800" y2="140" stroke="#d0d7de" stroke-width="1"/>

  <!-- Row 2: with & -->
  <text x="20" y="175" font-size="14" font-weight="600" fill="#1f2328">With &amp;: sh only starts the command in the background</text>
  <g font-size="13">
    <rect x="20" y="190" width="170" height="60" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <text x="105" y="217" text-anchor="middle" font-weight="600" fill="#1f2328">sh step starts</text>
    <text x="105" y="236" text-anchor="middle" font-size="12" fill="#57606a">... go-webapp-sample &amp;</text>

    <rect x="230" y="190" width="190" height="60" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <text x="325" y="217" text-anchor="middle" font-weight="600" fill="#1f2328">background job started</text>
    <text x="325" y="236" text-anchor="middle" font-size="12" fill="#57606a">no waiting</text>

    <rect x="460" y="190" width="160" height="60" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <text x="540" y="217" text-anchor="middle" font-weight="600" fill="#1f2328">sh returns 0</text>
    <text x="540" y="236" text-anchor="middle" font-size="12" fill="#57606a">"job started OK"</text>

    <rect x="660" y="190" width="140" height="60" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="730" y="217" text-anchor="middle" font-weight="700" fill="#1a7f37">SUCCESS</text>
    <text x="730" y="236" text-anchor="middle" font-size="12" fill="#cf222e">misleading!</text>

    <text x="325" y="282" text-anchor="middle" font-size="12" fill="#cf222e">…meanwhile the job fails: "go-webapp-sample: not found" (127), but nobody checks it</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" marker-end="url(#b)">
    <line x1="190" y1="220" x2="228" y2="220"/>
    <line x1="420" y1="220" x2="458" y2="220"/>
    <line x1="620" y1="220" x2="658" y2="220"/>
  </g>
  <line x1="325" y1="250" x2="325" y2="266" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
