<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How the Jenkins controller launches an SSH agent on node01: connect, verify host key, log in as bob, copy remoting.jar, start it with Java, then send builds over the open connection</title>
  <rect width="820" height="470" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>

  <!-- headers -->
  <rect x="20" y="15" width="220" height="60" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="130" y="42" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Jenkins controller</text>
  <text x="130" y="62" text-anchor="middle" font-size="12" fill="#57606a">holds bob's credentials</text>

  <rect x="580" y="15" width="220" height="60" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="690" y="42" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">node01 (agent)</text>
  <text x="690" y="62" text-anchor="middle" font-size="12" fill="#57606a">sshd on port 22 + Java</text>

  <!-- lifelines -->
  <line x1="130" y1="75" x2="130" y2="455" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="690" y1="75" x2="690" y2="455" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="145" y="100" font-size="12" font-weight="600" fill="#0969da">CONNECT (once, when the node is saved or relaunched)</text>

  <g font-size="13" fill="#1f2328">
    <!-- 1 -->
    <line x1="132" y1="130" x2="686" y2="130" stroke="#0969da" stroke-width="1.5" marker-end="url(#r)"/>
    <text x="410" y="123" text-anchor="middle"><tspan font-weight="600">1.</tspan> Open SSH connection to node01:22</text>
    <!-- 2 -->
    <line x1="686" y1="168" x2="134" y2="168" stroke="#0969da" stroke-width="1.5" marker-end="url(#r)"/>
    <text x="410" y="161" text-anchor="middle"><tspan font-weight="600">2.</tspan> node01 shows its host key; controller checks it</text>
    <!-- 3 -->
    <line x1="132" y1="206" x2="686" y2="206" stroke="#0969da" stroke-width="1.5" marker-end="url(#r)"/>
    <text x="410" y="199" text-anchor="middle"><tspan font-weight="600">3.</tspan> Log in as bob with the stored credentials</text>
    <!-- 4 -->
    <line x1="132" y1="244" x2="686" y2="244" stroke="#0969da" stroke-width="1.5" marker-end="url(#r)"/>
    <text x="410" y="237" text-anchor="middle"><tspan font-weight="600">4.</tspan> Copy remoting.jar to /home/bob</text>
    <!-- 5 -->
    <line x1="132" y1="282" x2="686" y2="282" stroke="#0969da" stroke-width="1.5" marker-end="url(#r)"/>
    <text x="410" y="275" text-anchor="middle"><tspan font-weight="600">5.</tspan> Run: java -jar remoting.jar</text>
    <!-- 6 -->
    <line x1="134" y1="320" x2="686" y2="320" stroke="#0969da" stroke-width="2.5" marker-start="url(#r)" marker-end="url(#r)"/>
    <text x="410" y="313" text-anchor="middle"><tspan font-weight="600">6.</tspan> Connection stays open → agent is online</text>
  </g>

  <line x1="20" y1="345" x2="800" y2="345" stroke="#d0d7de" stroke-width="1"/>
  <text x="145" y="368" font-size="12" font-weight="600" fill="#1a7f37">BUILD (every time a pipeline asks for linux-node)</text>

  <g font-size="13" fill="#1f2328">
    <line x1="132" y1="400" x2="686" y2="400" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#g)"/>
    <text x="410" y="393" text-anchor="middle">Send the steps over the same connection</text>
    <line x1="686" y1="440" x2="134" y2="440" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#g)"/>
    <text x="410" y="433" text-anchor="middle">Log output + exit codes back to the controller</text>
  </g>
  <rect x="700" y="388" width="105" height="40" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1"/>
  <text x="755" y="404" text-anchor="middle" font-size="11" fill="#1a7f37">runs as bob in</text>
  <text x="755" y="419" text-anchor="middle" font-size="11" fill="#1a7f37">~/workspace</text>
</svg>
