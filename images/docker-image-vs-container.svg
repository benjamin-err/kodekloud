<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Dockerfile and source become an image with docker build; an image becomes a container with docker run or goes to a registry with docker push</title>
  <rect width="820" height="250" fill="#ffffff"/>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <g font-size="14">
    <!-- inputs -->
    <rect x="20" y="70" width="170" height="90" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <text x="105" y="102" text-anchor="middle" font-weight="600" fill="#1f2328">Build context</text>
    <text x="105" y="124" text-anchor="middle" font-size="12" fill="#57606a">Dockerfile + source</text>
    <text x="105" y="140" text-anchor="middle" font-size="12" fill="#57606a">(the "." folder)</text>

    <!-- image -->
    <rect x="320" y="70" width="190" height="90" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="415" y="100" text-anchor="middle" font-weight="600" fill="#1f2328">Image</text>
    <text x="415" y="121" text-anchor="middle" font-size="12" fill="#57606a">packaged app + runtime</text>
    <text x="415" y="138" text-anchor="middle" font-size="11" fill="#57606a">go-webapp-sample:latest</text>
    <text x="415" y="185" text-anchor="middle" font-size="12" fill="#57606a">a template; it doesn't run</text>

    <!-- container -->
    <rect x="630" y="20" width="170" height="80" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="715" y="52" text-anchor="middle" font-weight="600" fill="#1f2328">Container</text>
    <text x="715" y="73" text-anchor="middle" font-size="12" fill="#57606a">a running instance</text>
    <text x="715" y="89" text-anchor="middle" font-size="12" fill="#57606a">of the image</text>

    <!-- registry -->
    <rect x="630" y="140" width="170" height="80" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
    <text x="715" y="172" text-anchor="middle" font-weight="600" fill="#1f2328">Registry</text>
    <text x="715" y="193" text-anchor="middle" font-size="12" fill="#57606a">e.g. Docker Hub,</text>
    <text x="715" y="209" text-anchor="middle" font-size="12" fill="#57606a">shared with servers</text>
  </g>

  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#c)">
    <line x1="190" y1="115" x2="318" y2="115"/>
    <path d="M510 100 C570 100 570 60 628 60"/>
    <path d="M510 130 C570 130 570 180 628 180"/>
  </g>
  <g font-size="12" font-family="SFMono-Regular, Consolas, monospace" fill="#0969da">
    <text x="254" y="106" text-anchor="middle">docker build</text>
    <text x="566" y="62" text-anchor="middle">docker run</text>
    <text x="566" y="196" text-anchor="middle">docker push</text>
  </g>
</svg>
